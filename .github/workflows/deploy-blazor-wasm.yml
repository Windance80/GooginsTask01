name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'   # ← Change to '9.0.x' or '6.0.x' if needed

      # Force output to ./publish (repo root), not inside BlazorWasm folder
      - name: Publish Blazor WASM project
        run: dotnet publish BlazorWasm/BlazorWasm.csproj -c Release -o ./publish --nologo

      - name: Fix base href
        run: |
          sed -i 's|<base href="/" />|<base href="/GooginsTask01/" />|g' ./publish/wwwroot/index.html

      - name: Create 404.html for SPA routing
        run: |
          cat > ./publish/wwwroot/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Single Page Apps for GitHub Pages</title>
              <script type="text/javascript">
                var pathSegmentsToKeep = 1;
                var l = window.location;
                var newPath = "";
                if (pathSegmentsToKeep > 0) {
                  var path = l.pathname.slice(1).split('/');
                  if (path.length > pathSegmentsToKeep) {
                    newPath = '/' + path.slice(pathSegmentsToKeep).join('/') + l.search + l.hash;
                  }
                }
                l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + newPath);
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish/wwwroot
          destination_dir: ./
          keep_files: false