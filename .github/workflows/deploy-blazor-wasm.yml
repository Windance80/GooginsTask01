name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ master ]           # change to 'master' if that's your default branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'    # Your project targets net10.0 but 9.0.x SDK works; change to '10.0.x' if you have a 10.0 preview installed locally

      - name: Publish Blazor WASM project
        run: dotnet publish BlazorWasm/BlazorWasm.csproj -c Release -o ./publish --nologo

      # Fix base href → must be /GooginsTask01/ (case-sensitive!)
      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/GooginsTask01/" />|g' ./publish/index.html

      # Add 404.html for SPA routing (refresh/direct links)
      - name: Create 404.html for SPA routing
        run: |
          cat > ./publish/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Single Page Apps for GitHub Pages</title>
              <script type="text/javascript">
                var pathSegmentsToKeep = 1;
                var l = window.location;
                var newPath = "";
                if (pathSegmentsToKeep > 0) {
                  var path = l.pathname.slice(1).split('/');
                  if (path.length > pathSegmentsToKeep) {
                    newPath = '/' + path.slice(pathSegmentsToKeep).join('/') + l.search + l.hash;
                  }
                }
                l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + newPath);
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish          # ← THIS WAS THE PROBLEM! Now points to the correct folder
          destination_dir: ./             # Deploy to root of gh-pages
          keep_files: false