<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages</title>
    <script type="text/javascript">
      // Redirect to the root path, preserving the original path as a hash
      var pathSegmentsToKeep = 1; // Change to 0 if hosted at root domain
      var l = window.location;
      var newPath = "";
      if (pathSegmentsToKeep > 0) {
        var path = l.pathname.slice(1).split('/');
        if (path.length > pathSegmentsToKeep) {
          newPath = '/' + path.slice(pathSegmentsToKeep).join('/') + l.search + l.hash;
        }
      }
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + newPath);
    </script>
  </head>
  <body></body>
</html>
